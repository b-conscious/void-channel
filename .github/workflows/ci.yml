# CI: the two checks that would have caught every breakage this stack has had.
# 1) The web bundle must compile. 2) Spine + backend JS must parse and fixtures must map.
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check backend + spine
        run: |
          for f in backend/*.js spine/*.js; do node --check "$f"; done
      - name: Install backend deps (spine reuses archive.js which needs node-fetch)
        run: cd backend && npm ci --omit=dev || npm install --omit=dev
      - name: Install spine deps
        run: cd spine && npm install --omit=dev
      - name: Fixture run (network: archive.org)
        run: cd spine && node test-fixtures.js
        continue-on-error: true   # Archive flakiness must not block deploys; the log is the signal

  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install app deps
        run: cd mobile && npm ci || npm install
      - name: Export web bundle (the compile gate)
        run: cd mobile && npx expo export --platform web --output-dir ../.ci-dist
